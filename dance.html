<!-- Pixel Dancer Widget for GitHub Pages (Cyber Blue - groove) -->
<div id="gh-pixel-dancer-widget" style="width:180px;height:180px;border-radius:16px;overflow:hidden;border:1px solid #30363d;background:#10151d;display:inline-block;">
  <canvas id="gh-dancer-canvas" width="180" height="180" style="width:100%;height:100%;image-rendering:pixelated;display:block;"></canvas>
</div>
<script>
(function(){
  const c = document.getElementById('gh-dancer-canvas'), ctx = c.getContext('2d');
  const pal = {"O":"#090d16","H":"#1e293b","A":"#38bdf8","S":"#fcd34d","E":"#090d16","T":"#f43f5e","D":"#be123c","P":"#334155","K":"#f8fafc"};
  const bg = "#10151d", floor = "#1e293b", noteCol = "#38bdf8";
  const move = "groove", speed = 1, showNotes = true;
  const frames = [["........................","........OOOOOOOO........",".......OOAAAAAAOO.......",".......OHHHHHHHHO.......",".....OOHHHHHHHHHHOO.....","....OOOHHHHHHHHHHOOO....","....OOAHSSSSSSSSHAOO....","....OOAHSKESSKESHAOO....","....OOASSEESSEESSAOO....","....OOOSSSSSSSSSSOOO....","...OSSOSSSSSSSSSSOO.....","...OSSTTTTTDDTTTTTO.....","....OTTTTTTDDTTTTTO.....",".....OOOTTTDDTTTTTO.....",".......OTTTDDTTTTTO.....",".......OTTTDDTTTTTO.....",".......ODDDDDDDDSSO.....",".......OPPPOOPPPSSO.....",".......OPPPOOPPPOO......",".......OPPPOOPPPO.......",".......OPPPOOPPPO.......","......OKKKKOOKKKKO......","......OKKKKOOKKKKO......",".......OOOO..OOOO......."],["........................","........................","........................","........OOOOOOOO........",".......OOAAAAAAOO.......",".......OHHHHHHHHO.......",".....OOHHHHHHHHHHOO.....","....OOOHHHHHHHHHHOOO....","....OOAHSSSSSSSSHAOO....","....OOAHSSESSESSHAOO....","....OOASSESSSSESSAOO....","....OOOSSSSSSSSSSOOO....",".....OTTTTTDDTTTTTO.....",".....OTTTTTDDTTTTTO.....",".....OTTTTTDDTTTTTO.....",".....OTTTTTDDTTTTTO.....",".....OTTTTTDDTTTTTO.....",".....OSSDDDDDDDDSSO.....",".....OSPPPPOOPPPPSO.....","......OPPPPOOPPPPO......","......OPPPPOOPPPPO......",".....OKKKKKOOKKKKKO.....",".....OKKKKKOOKKKKKO.....","......OOOOO..OOOOO......"],["........................","........OOOOOOOO........",".......OOAAAAAAOO.......",".......OHHHHHHHHO.......",".....OOHHHHHHHHHHOO.....","....OOOHHHHHHHHHHOOO....","....OOAHSSSSSSSSHAOO....","....OOAHSKESSKESHAOO....","....OOASSEESSEESSAOO....","....OOOSSSSSSSSSSOOO....",".....OOSSSSSSSSSSOSSO...",".....OTTTTTDDTTTTTSSO...",".....OTTTTTDDTTTTTTO....",".....OTTTTTDDTTTOOO.....",".....OTTTTTDDTTTO.......",".....OTTTTTDDTTTO.......",".....OSSDDDDDDDDO.......",".....OSSPPPOOPPPO.......","......OOPPPOOPPPO.......",".......OPPPOOPPPO.......",".......OPPPOOPPPO.......","......OKKKKOOKKKKO......","......OKKKKOOKKKKO......",".......OOOO..OOOO......."],["........................","........................","........................","........OOOOOOOO........",".......OOAAAAAAOO.......",".......OHHHHHHHHO.......",".....OOHHHHHHHHHHOO.....","....OOOHHHHHHHHHHOOO....","....OOAHSSSSSSSSHAOO....","....OOAHSSESSESSHAOO....","....OOASSESSSSESSAOO....","...OSSOSSSSSSSSSSOSSO...","...OSSTTTTTDDTTTTTSSO...","....OTTTTTTDDTTTTTTO....",".....OOOTTTDDTTTOOO.....",".......OTTTDDTTTO.......",".......OTTTDDTTTO.......",".......ODDDDDDDDO.......","......OPPPPOOPPPPO......","......OPPPPOOPPPPO......","......OPPPPOOPPPPO......",".....OKKKKKOOKKKKKO.....",".....OKKKKKOOKKKKKO.....","......OOOOO..OOOOO......"]];
  let idx = 0, notes = [];
  function draw() {
    const s = Math.floor(c.width / 32);
    ctx.fillStyle = bg; ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = floor; ctx.fillRect(3*s, 26*s, 26*s, 3*s);
    const sw = idx % 2 === 1 ? 14 : 10;
    ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.fillRect(Math.floor((32-sw)/2)*s, 27*s, sw*s, s);
    const grid = frames[idx % frames.length];
    for(let y=0; y<24; y++) for(let x=0; x<24; x++) {
      const ch = grid[y][x];
      if(ch !== '.' && pal[ch]) { ctx.fillStyle = pal[ch]; ctx.fillRect((4+x)*s, (4+y)*s, s, s); }
    }
    if(showNotes) {
      notes.forEach((n, i) => {
        ctx.globalAlpha = Math.max(0, n.l); ctx.fillStyle = noteCol;
        ctx.fillRect(Math.round(n.x)*s, Math.round(n.y+2)*s, 2*s, 2*s);
        ctx.fillRect(Math.round(n.x+1)*s, Math.round(n.y)*s, s, 3*s);
        n.x += n.vx; n.y += n.vy; n.l -= 0.03;
      });
      notes = notes.filter(n => n.l > 0);
      ctx.globalAlpha = 1;
    }
  }
  setInterval(() => {
    idx = (idx + 1) % frames.length;
    if(showNotes && idx % 2 === 0) notes.push({x: Math.random()>0.5?23:6, y:11, vx:(Math.random()>0.5?1:-1)*0.2, vy:-0.35, l:1});
    draw();
  }, 250);
  draw();
})();
</script>
